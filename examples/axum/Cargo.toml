[package]
name = "narsil-axum-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
narsil-axum = { path = "../../crates/narsil-axum", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
